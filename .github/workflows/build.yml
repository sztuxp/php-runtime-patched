name: Build & Push PHP Runtime to Docker Hub

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: '選擇目標 PHP 版本號'
        required: true
        default: '8.3'
        type: choice
        options:
          - '8.2'
          - '8.3'
          - '8.4'
      image_tag:
        description: '自訂 Docker Hub 鏡像標籤 (例如 php8.3-latest)'
        required: true
        default: 'php8.3-latest'
        type: string

env:
  # 鏡像名稱格式：你的DockerHub用戶名/倉庫名（若不存在，Docker Hub 會自動建立）
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/php-runtime-patched

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          pull: true
          build-args: |
            PHP_VER=${{ github.event.inputs.php_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
