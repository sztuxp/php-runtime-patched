name: Build & Push Single-PHP Multi-Arch Runtime (Dev)

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: '選擇目標單一 PHP 版本號'
        required: true
        default: '8.3'
        type: choice
        options:
          - '8.2'
          - '8.3'
          - '8.4'
      image_tag:
        description: '自訂 Docker Hub 鏡像標籤 (預設為 dev，避免覆蓋 main 的 latest)'
        required: true
        default: 'dev'
        type: string

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/php-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          no-cache: true
          pull: true
          build-args: |
            PHP_VER=${{ github.event.inputs.php_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
